<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMN Ritual Sound Studio - MVP Step 1</title>
  <style>
    :root {
      --color-bg: #1F1F1F;
      --color-primary: #FF6F3C;
      --color-accent: #A8E6CF;
      --color-text: #FFFFFF;
      --color-secondary-text: #666666;

      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Museo Moderno', serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --color-bg: #FFFFFF;
        --color-text: #000000;
        --color-secondary-text: #333333;
      }
    }

    * {
      box-sizing: border-box;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body), serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading), sans-serif;
      margin: 0 0 0.5em;
    }

    header {
      background: var(--color-bg);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-secondary-text);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--color-primary);
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 1rem;
    }

    nav a {
      color: var(--color-text);
      text-decoration: none;
      font-family: var(--font-heading);
    }

    nav a:focus,
    nav a:hover {
      color: var(--color-primary);
      outline: none;
    }

    .hero {
      padding: 3rem 1rem;
      text-align: center;
      background: var(--color-bg);
      color: var(--color-text);
    }

    .chat {
      background: #2a2a2a;
      border-radius: 0.5rem;
      padding: 1rem;
      margin: 2rem auto;
      max-width: 600px;
    }

    .chat p {
      margin: 0 0 1rem;
    }

    .bubble {
      background: var(--color-primary);
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      color: #000;
    }

    .chat-form {
      display: flex;
      gap: 0.5rem;
    }

    .chat-form input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--color-secondary-text);
      border-radius: 0.25rem;
      font-family: var(--font-body);
    }

    .chat-form button {
      background: var(--color-accent);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      font-family: var(--font-heading);
      cursor: pointer;
    }

    .chat-form button:focus,
    .chat-form button:hover {
      background: var(--color-primary);
      color: #000;
    }

    .session-card {
      background: #2a2a2a;
      border-radius: 0.5rem;
      padding: 1rem;
      margin: 2rem auto;
      max-width: 600px;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .controls button {
      flex: 1;
      padding: 0.5rem;
      font-family: var(--font-heading);
      border: none;
      border-radius: 0.25rem;
      background: var(--color-primary);
      color: #000;
      cursor: pointer;
    }

    .controls button:hover,
    .controls button:focus {
      background: var(--color-accent);
    }

    .affirmation {
      text-align: center;
      font-style: italic;
      margin: 2rem 1rem;
      color: var(--color-secondary-text);
    }

    footer {
      text-align: center;
      padding: 1rem;
      border-top: 1px solid var(--color-secondary-text);
      font-size: 0.875rem;
      background: var(--color-bg);
    }

    @media (min-width: 768px) {
      .chat, .session-card {
        margin: 2rem auto;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Museo+Moderno:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="#" class="logo">HUMN Ritual Sound Studio</a>
    <nav role="navigation" aria-label="Main navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Sessions</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Step into your sanctuary...</h1>
      <p>Your personal ritual sound studio awaits.</p>
    </section>

    <section class="chat" aria-label="Chat interface">
      <div class="bubble" role="status">HUMN: What vibe are you feeling today?</div>
      <form class="chat-form" action="#" method="post">
        <label for="chat-input" class="visually-hidden">Your response</label>
        <input id="chat-input" type="text" placeholder="Type your vibe..." required>
        <button type="submit">Send</button>
      </form>
    </section>

    <section class="session-card" aria-label="Session player">
      <h2>Session Title</h2>
      <audio controls style="width:100%">
        <source src="session.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
      <div class="controls">
        <button type="button">Play</button>
        <button type="button">Download</button>
        <button type="button">Save</button>
      </div>
    </section>

    <section class="affirmation">
      <p><em>You are the architect of your calm.</em></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 HUMN Ritual Sound Studio. All rights reserved.</p>
    <nav aria-label="Footer links">
      <a href="#">Terms</a> | <a href="#">Privacy</a>
    </nav>
  </footer>
</body>
</html>
